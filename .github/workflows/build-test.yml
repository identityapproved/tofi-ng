name: Test build process

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'themes/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'themes/**'

jobs:
  ubuntu:

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        lto: [true, false]

    name: ubuntu-24.04 (${{ matrix.cc }}, lto=${{ matrix.lto }})

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential llvm clang meson scdoc \
          ninja-build libfreetype-dev libharfbuzz-dev libcairo-dev \
          libpango1.0-dev libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Build and test
        env:
          CC: ${{ matrix.cc }}
        run: |
          meson setup build -Dwerror=true -Db_lto=${{ matrix.lto }}
          meson test -C build

  alpine:

    runs-on: ubuntu-24.04
    container: alpine:latest

    steps:
      - name: Install dependencies
        run: |
          apk add build-base git meson scdoc freetype-dev harfbuzz-dev \
          cairo-dev pango-dev glib-dev wayland-dev wayland-protocols \
          libxkbcommon-dev musl-fts-dev

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Build and test
        run: |
          meson setup build -Dwerror=true
          meson test -C build
